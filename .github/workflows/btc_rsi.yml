{"name": "BTC RSI alert",
"on": {
"schedule": [{"cron": "7 0,4,8,12,16,20 * * *"}],
"workflow_dispatch": {"inputs": {"test": {"description": "테스트 메시지 보내기", "type": "boolean", "default": true}}}
},
"jobs": {"alert": {"runs-on": "ubuntu-latest", "steps": [
{"uses": "actions/checkout@v4"},
{"uses": "actions/setup-python@v5", "with": {"python-version": "3.12"}},
{"run": "python btc_rsi_alert.py", "env": {
"TG_BOT_TOKEN": "${{ secrets.TG_BOT_TOKEN }}",
"TG_CHAT_ID": "${{ secrets.TG_CHAT_ID }}",
"TEST_MODE": "${{ github.event_name == 'workflow_dispatch' && inputs.test }}",
"SYMBOL": "BTCUSDT",
"INTERVAL": "4h",
"RSI_LEN": "14",
"RSI_LOW": "25",
"RSI_HIGH": "85"
}}
]}}}
