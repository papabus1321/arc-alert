name: Arc Meme Alert

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arc-alert
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests

      - name: Check script version
        run: grep -q -- "--once" arc_meme_alert*.py || { echo "OLD SCRIPT VERSION - upload the latest file"; exit 1; }

      - name: Telegram test (manual run only)
        if: github.event_name == 'workflow_dispatch'
        run: python arc_meme_alert*.py --test

      - name: Check new listings
        run: python arc_meme_alert*.py --once

      - name: Save alert state
        run: |
          git config user.name "arc-alert-bot"
          git config user.email "arc-alert-bot@users.noreply.github.com"
          git add arc_alert_state.json 2>/dev/null || exit 0
          git diff --cached --quiet || (git commit -m "update alert state" && git push)
